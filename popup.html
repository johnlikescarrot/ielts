<!doctype html><html lang="en"><head><meta charset="utf-8"><title>IELTS Slayer</title><style>body{font:16px system-ui;min-width:320px;padding:18px;color:#172033}button,select{padding:9px;margin:4px;border:1px solid #ccd5e0;border-radius:8px;background:white}button{cursor:pointer}main{display:grid;gap:12px}.card{padding:22px;border-radius:14px;background:#eef5ff;min-height:70px}</style></head><body><main><header><strong id="title">IELTS Slayer</strong><select id="language" aria-label="Language"><option value="en">English</option><option value="vi">Tiếng Việt</option></select></header><h2 id="review">Review</h2><div class="card" id="prompt"></div><small><span id="count">0</span> cards due</small><div><button data-rating="0">Again</button><button data-rating="1">Hard</button><button data-rating="2">Good</button><button data-rating="3">Easy</button></div></main><script type="module" src="popup.js"></script></body></html>
