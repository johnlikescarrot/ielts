name: CI
on:
  pull_request:
  push:
    branches: [main, arena/01a0e180-ielts]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
      - name: Validate Firefox extension
        run: npx web-ext lint --source-dir dist
      - name: Super-Linter
        uses: super-linter/super-linter/slim@v8.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: true
          # Super-Linter is an additional advisory pass; pinned project tools are blocking.
          DISABLE_ERRORS: true
          # TypeScript/JavaScript are already checked by the repository's pinned ESLint.
          VALIDATE_TYPESCRIPT_ES: false
          VALIDATE_JAVASCRIPT_ES: false
          VALIDATE_JSON: true
          VALIDATE_MARKDOWN: false
          VALIDATE_YAML: false
          FILTER_REGEX_EXCLUDE: '(package-lock.json|\.astryx/.*)'
