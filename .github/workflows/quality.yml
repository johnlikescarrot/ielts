name: Quality

on:
  push:
    branches: [main, arena/01a0e182-ielts]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read
  statuses: write

jobs:
  test-build:
    name: Test, coverage, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=moderate
      - name: Package Firefox extension
        run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: ielts-forge-firefox
          path: ielts-forge-firefox.zip

  super-linter:
    name: Super-Linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run Super-Linter
        uses: super-linter/super-linter@v8.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main
          VALIDATE_ALL_CODEBASE: true
          # Project-owned validators are blocking above; Super-Linter remains an
          # always-on independent advisory check of the workflow itself.
          DISABLE_ERRORS: true
          # Enabling exactly one validator selects it and disables the others.
          # Project-owned TypeScript, formatting, coverage, and build checks stay
          # blocking in the test-build job; this independent pass checks Actions.
          VALIDATE_GITHUB_ACTIONS: true
