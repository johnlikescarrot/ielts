name: Super-Linter Quality Check

on:
  push:
    branches: [ main, 'arena/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: read
  statuses: write

jobs:
  super-linter:
    name: Lint Code Base with Super-Linter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint Code Base
        uses: super-linter/super-linter@v8.3.1
        env:
          VALIDATE_ALL_CODEBASE: true
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_TYPESCRIPT_ES: true
          VALIDATE_JAVASCRIPT_ES: true
          VALIDATE_JSON: true
          VALIDATE_MARKDOWN: true
          VALIDATE_CSS: true
          VALIDATE_HTML: true
          # The project standardizes on ESLint and dedicated project configs;
          # formatting is intentionally not enforced by Prettier in this repository.
          VALIDATE_TYPESCRIPT_PRETTIER: false
          VALIDATE_JAVASCRIPT_PRETTIER: false
          VALIDATE_JSON_PRETTIER: false
          VALIDATE_CSS_PRETTIER: false
          VALIDATE_HTML_PRETTIER: false
          VALIDATE_MARKDOWN_PRETTIER: false
          VALIDATE_YAML_PRETTIER: false
          MARKDOWN_CONFIG_FILE: .markdown-lint.yml
          LINTER_RULES_PATH: /
          JAVASCRIPT_ES_CONFIG_FILE: eslint.config.js
          TYPESCRIPT_ES_CONFIG_FILE: eslint.config.js
