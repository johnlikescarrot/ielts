name: Super-Linter Quality Check

on:
  push:
    branches: [ main, 'arena/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: read
  statuses: write

jobs:
  super-linter:
    name: Lint Code Base with Super-Linter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install project lint configuration dependencies
        run: npm ci

      - name: Lint Code Base
        uses: super-linter/super-linter@v8.3.1
        env:
          VALIDATE_ALL_CODEBASE: true
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_TYPESCRIPT_ES: false
          VALIDATE_JAVASCRIPT_ES: false
          VALIDATE_JSON: false
          LINTER_RULES_PATH: /
          TYPESCRIPT_ES_CONFIG_FILE: eslint.config.js
          CSS_CONFIG_FILE: .stylelintrc.json
          HTML_CONFIG_FILE: .htmlhintrc
          MARKDOWN_CONFIG_FILE: .markdownlint.json
