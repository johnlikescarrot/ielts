name: Super-Linter Quality Check

on:
  push:
    branches: [ main, 'arena/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: read
  statuses: write

jobs:
  super-linter:
    name: Lint Code Base with Super-Linter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js for project ESLint config
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install project lint dependencies
        run: npm ci

      - name: Lint Code Base
        uses: super-linter/super-linter@v8.3.1
        env:
          VALIDATE_ALL_CODEBASE: true
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # TypeScript/JavaScript linting is covered by the project-aware ESLint
          # step in CI; Super-Linter's default JS rules do not understand this
          # Vite + TS path setup or the repository's flat ESLint config.
          VALIDATE_TYPESCRIPT_ES: false
          VALIDATE_JAVASCRIPT_ES: false
          # Do not mix explicit VALIDATE_* true and false values; Super-Linter
          # treats that combination as unsupported. Unset validators keep their
          # default auto-detection behavior.
          # Markdown/CSS/HTML are intentionally covered by lightweight local
          # configs and browser build tests; keep Super-Linter focused on the
          # portable repository metadata checks it can run consistently here.
          VALIDATE_MARKDOWN: false
          VALIDATE_CSS: false
          VALIDATE_HTML: false
          LINTER_RULES_PATH: /
