name: Super-Linter Quality Check

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read
  statuses: write

jobs:
  super-linter:
    name: Lint Code Base with Super-Linter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint Code Base
        continue-on-error: true
        uses: super-linter/super-linter@v8.3.1
        env:
          VALIDATE_ALL_CODEBASE: true
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # TypeScript/React, CSS, and build correctness are enforced by the dedicated
          # npm/ESLint/Vitest/Vite CI job. Super-Linter still runs on every PR for
          # repository hygiene formats that it handles consistently in this project.
          VALIDATE_TYPESCRIPT_ES: false
          VALIDATE_JAVASCRIPT_ES: false
          FILTER_REGEX_INCLUDE: ^(README\.md|package\.json|public/_locales/(en|vi)/messages\.json)$
          VALIDATE_JSON: true
          VALIDATE_MARKDOWN: true
          VALIDATE_YAML: false
          VALIDATE_CSS: false
          VALIDATE_HTML: false
          LINTER_RULES_PATH: .github/linters
