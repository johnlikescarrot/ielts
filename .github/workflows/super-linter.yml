name: Super-Linter Quality Check

on:
  push:
    branches: [ main, 'arena/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: read
  statuses: write

jobs:
  super-linter:
    name: Lint Code Base with Super-Linter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint Code Base
        uses: super-linter/super-linter@v8.3.1
        env:
          VALIDATE_ALL_CODEBASE: true
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # TypeScript is covered by the Node CI job after npm ci. This
          # container pass validates the repository's portable file formats.
          VALIDATE_JSON: true
          VALIDATE_MARKDOWN: true
          VALIDATE_CSS: true
          VALIDATE_HTML: true
          MARKDOWN_CONFIG_FILE: .markdown-lint.yml
          LINTER_RULES_PATH: /
